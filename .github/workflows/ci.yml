name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  quality:
    name: Typecheck / Lint / Build
    runs-on: ubuntu-latest

    env:
      # Secrets that don't affect static generation — safe to stub.
      OPENAI_API_KEY: "sk-dummy"
      STRIPE_SECRET_KEY: "sk_test_dummy"
      STRIPE_WEBHOOK_SECRET: "whsec_dummy"
      STRIPE_VERIFIED_PRICE_ID: "price_dummy_verified"
      STRIPE_PREMIUM_PRICE_ID: "price_dummy_premium"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_dummy"
      RESEND_API_KEY: "re_dummy"
      MCP_API_KEY: "ci-dummy-mcp-key"
      GOOGLE_CLIENT_ID: "ci-dummy-google-client-id"
      GOOGLE_CLIENT_SECRET: "ci-dummy-google-client-secret"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      # DB and auth secrets must be real for generateStaticParams to run.
      # Add DATABASE_URL, JWT_SECRET, ADMIN_PASSWORD to GitHub Actions secrets.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
